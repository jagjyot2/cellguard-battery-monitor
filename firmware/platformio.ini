; CellGuard PlatformIO Firmware Configuration
; Non-Invasive 21700 Li-Ion Pack Telemetry & Health Analytics Monitor (1S-6S)
; SAFETY: Monitor-only instrument used alongside external commercial BMS & main fuse.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D CELLGUARD_FW_VERSION=\"1.0.0\"
    -D CELLGUARD_MONITOR_ONLY=1
    -Wall
    -Wextra
    -Werror=return-type
lib_deps =
    Wire
    Preferences
